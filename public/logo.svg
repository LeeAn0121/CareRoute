<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Modern Gradient (Deep Care Navy/Blue) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Warm Heart & Care Accent Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>

    <!-- Clean Route Glow Gradient -->
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Drop Shadows for 3D App Icon Depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- One UI Squircle App Icon Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" filter="url(#cardShadow)" />

  <!-- Subtle Inner Specular Light Border -->
  <rect x="4" y="4" width="504" height="504" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />

  <!-- Care Route Dynamic Connecting Waves (Route Pathway) -->
  <path d="M 80 390 C 150 430, 210 330, 270 370 C 330 410, 390 380, 440 330" 
        fill="none" 
        stroke="url(#routeGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-dasharray="2 24" 
        opacity="0.5" />
  
  <path d="M 100 370 C 170 390, 210 310, 280 340 C 350 370, 390 320, 430 290" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linecap="round" 
        opacity="0.3" />

  <!-- Central Care Route Pin (Symbolizing Home & Visit) -->
  <g filter="url(#pinShadow)">
    <!-- White Map Pin Housing -->
    <path d="M 256 90 
             C 178 90, 116 152, 116 230 
             C 116 308, 222 414, 256 438 
             C 290 414, 396 308, 396 230 
             C 396 152, 334 90, 256 90 Z" 
          fill="#FFFFFF" />

    <!-- Loving Care Heart inside Pin -->
    <path d="M 256 295
             C 252 295, 202 258, 178 228
             C 158 202, 160 166, 186 148
             C 208 132, 238 138, 256 160
             C 274 138, 304 132, 326 148
             C 352 166, 354 202, 334 228
             C 310 258, 260 295, 256 295 Z" 
          fill="url(#heartGrad)" />

    <!-- Pulse Signal / Route Dot on Heart -->
    <circle cx="256" cy="205" r="14" fill="#FFFFFF" />
  </g>

  <!-- Small Route Destination Star/Glow -->
  <circle cx="396" cy="120" r="12" fill="#FDE047" opacity="0.9" />
</svg>
