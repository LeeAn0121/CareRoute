<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>화면 표시 환경 업데이트 · 케어루트</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: #f2f2f7; color: #1c1c1e; font: 17px/1.65 system-ui, sans-serif; }
    main { max-width: 560px; margin: auto; padding: 32px 20px; }
    h1 { font-size: 26px; line-height: 1.4; overflow-wrap: anywhere; }
    p { overflow-wrap: anywhere; }
    a, button { display: block; width: 100%; margin-top: 12px; padding: 14px 16px; border: 1px solid #d1d1d6; border-radius: 14px; text-align: center; text-decoration: none; background: white; color: #1c1c1e; font: inherit; cursor: pointer; }
    .primary { background: #007aff; color: white; border-color: #007aff; }
    :focus-visible { outline: 3px solid #007aff; outline-offset: 3px; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } a, button { background: #1c1c1e; color: #fff; border-color: #48484a; } .primary { background: #007aff; border-color: #007aff; } }
  </style>
</head>
<body>
  <main>
    <p>케어루트</p>
    <h1 id="heading">앱 화면을 열지 못했습니다</h1>
    <p id="reason">앱을 불러오는 중 문제가 발생했습니다. 연결 상태를 확인하고 앱을 완전히 종료한 뒤 다시 열어 주세요.</p>
    <p>이 앱은 WebView 111 이상에서 동작합니다. Play 스토어에서 Android System WebView와 Chrome의 업데이트도 확인해 주세요. 기기에 따라 Chrome이 화면 표시를 담당합니다.</p>
    <a class="primary" href="https://play.google.com/store/apps/details?id=com.google.android.webview" target="_blank" rel="noopener">WebView 업데이트 열기</a>
    <a href="https://play.google.com/store/apps/details?id=com.android.chrome" target="_blank" rel="noopener">Chrome 업데이트 열기</a>
    <button id="retry" type="button" hidden onclick="location.href='/CareRoute/'">앱 화면 다시 열기</button>
    <p>업데이트할 수 없는 기기에서는 지원되는 최신 환경을 사용해 주세요. 앱을 삭제하거나 데이터를 지울 필요는 없습니다.</p>
  </main>
  <script>
    var version = navigator.userAgent.match(/(?:Chrome|Chromium)\/(\d+)/);
    if (version && Number(version[1]) < 111) {
      document.getElementById('heading').textContent = '화면 표시 환경을 업데이트해 주세요';
      document.getElementById('reason').textContent = '이 기기의 WebView 버전이 오래되어 화면을 표시하지 못했습니다. 업데이트 후 앱을 완전히 종료했다가 다시 열어 주세요.';
    } else {
      document.getElementById('retry').hidden = false;
    }
  </script>
</body>
</html>
